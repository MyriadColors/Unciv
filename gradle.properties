# Gradle Daemon & Memory Tuning
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin Incremental Compilation & Caching
kotlin.incremental=true
kotlin.caching.enabled=true

# Keep daemon alive and clean up stale outputs
org.gradle.vfs.watch=true
