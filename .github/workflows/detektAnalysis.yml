name: Detekt

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  detekt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        module: [core, tests, desktop, server]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'adopt'

    - name: Setup Detekt
      id: setup_detekt
      uses: peter-murray/setup-detekt@v3

    - name: Detekt errors
      run: detekt-cli --parallel --build-upon-default-config --fail-on-severity error --config .github/workflows/detekt_config/detekt-errors.yml --baseline ${{ matrix.module }}/detekt-baseline.xml --input ${{ matrix.module }}/src

    - name: Detekt warnings
      run: detekt-cli --parallel --build-upon-default-config --config .github/workflows/detekt_config/detekt-warnings.yml --baseline ${{ matrix.module }}/detekt-baseline.xml --input ${{ matrix.module }}/src
